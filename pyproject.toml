[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyorm"
version = "0.1.0"
description = "A from-scratch Python ORM: models, lazy queries, Unit of Work, and migrations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PyORM" }]
keywords = ["orm", "sqlite", "postgresql", "database"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
]

[project.scripts]
pyorm = "pyorm.cli:main"

[project.urls]
Homepage = "https://github.com/example/pyorm"

[tool.setuptools.packages.find]
include = ["pyorm"]

[tool.setuptools.package-data]
pyorm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pyorm"]
branch = true
omit = ["pyorm/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["pyorm"]
